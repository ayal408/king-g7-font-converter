name: Build Windows release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "king_g7_font_converter_gui.py"
      - "ttf_to_king_lib.py"
      - "requirements.txt"
      - "README-HE.txt"
      - "THIRD-PARTY-NOTICES.txt"
      - ".github/workflows/build-release.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt

      - name: Build standalone converter
        run: >
          pyinstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name KingG7FontConverter
          king_g7_font_converter_gui.py

      - name: Assemble distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item dist\KingG7FontConverter.exe package\
          Copy-Item king_g7_font_converter_gui.py package\
          Copy-Item ttf_to_king_lib.py package\
          Copy-Item README-HE.txt package\
          Copy-Item THIRD-PARTY-NOTICES.txt package\
          $hash = (Get-FileHash package\KingG7FontConverter.exe -Algorithm SHA256).Hash
          "$hash  KingG7FontConverter.exe" | Set-Content package\SHA256.txt -Encoding ascii
          Compress-Archive -Path package\* -DestinationPath KING-G7-Font-Converter.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: KING-G7-Font-Converter
          path: |
            package/KingG7FontConverter.exe
            KING-G7-Font-Converter.zip

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.0 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.0.0 package\KingG7FontConverter.exe KING-G7-Font-Converter.zip --clobber
          } else {
            gh release create v1.0.0 package\KingG7FontConverter.exe KING-G7-Font-Converter.zip --target "$env:GITHUB_SHA" --title "KING G7 Font Converter v1.0.0" --notes "Portable Windows converter for TTF, OTF and TTC fonts. No Python installation is required."
          }
